[package]
name = "rustcloud-db"
description = "Database schema (SeaORM entities and migrations) for RustCloud; works with PostgreSQL and SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Helpers for tests in other crates: a fresh, migrated database per test.
testing = ["dep:tempfile"]

[dependencies]
chrono.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
tempfile = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rustcloud-db = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true
