[package]
name = "rustcloud-ml"
description = "Neural networks (ONNX) for RustCloud's plugins, each model in a confined process of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# `onnx-worker`, a stand-in for `rustcloud onnx-worker` in this crate's tests.
testing = []

[[bin]]
name = "onnx-worker"
path = "src/bin/onnx-worker.rs"
required-features = ["testing"]

[dependencies]
rustcloud-core.workspace = true
rustcloud-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tract-onnx.workspace = true

[dev-dependencies]
prost.workspace = true
rustcloud-ml = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true
