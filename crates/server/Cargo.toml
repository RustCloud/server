[package]
name = "rustcloud-server"
description = "The RustCloud server: HTTP API and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustcloud"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
figment.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
mime_guess.workspace = true
openidconnect.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rust-embed.workspace = true
rustcloud-auth.workspace = true
rustcloud-core.workspace = true
rustcloud-db.workspace = true
rustcloud-files.workspace = true
rustcloud-media.workspace = true
rustcloud-ml.workspace = true
rustcloud-plugin-api.workspace = true
rustcloud-sandbox.workspace = true
rustcloud-storage-local.workspace = true
rustcloud-wasm-host.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
toml_edit.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
http-body-util.workspace = true
rustcloud-db = { workspace = true, features = ["testing"] }
rustcloud-wasm-host = { workspace = true, features = ["testing"] }
