name: Release

# Builds the Docker image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/<repo>: :latest and :sha-<short sha>, plus :<version> for a
# v* tag. Started by hand (Actions → Release → Run workflow) or by pushing a
# v* tag. It doesn't run tests or lint: check that Test and Lint passed first.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and the OCI labels (source, revision, licence) that link the
      # package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # The ffmpeg stage takes most of the time; the layer cache keeps it
      # between runs until docker/build-ffmpeg.sh changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
