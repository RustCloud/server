name: Release

# Builds the Docker image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/<repo>: :latest and :sha-<short sha>, plus :<version> for a
# v* tag. Started by hand (Actions → Release → Run workflow) or by pushing a
# v* tag. It doesn't run tests or lint: check that Test and Lint passed first.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and the OCI labels (source, revision, licence) that link the
      # package to this repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # The ffmpeg stage takes most of the time; the layer cache keeps it
      # between runs until docker/build-ffmpeg.sh changes.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
