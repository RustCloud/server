[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
# Workspace crates
rustcloud-core = { path = "crates/core" }
rustcloud-db = { path = "crates/db" }
rustcloud-storage-local = { path = "crates/storage-local" }
rustcloud-auth = { path = "crates/auth" }
rustcloud-files = { path = "crates/files" }
rustcloud-plugin-api = { path = "crates/plugin-api" }
rustcloud-wasm-host = { path = "crates/wasm-host" }
rustcloud-sandbox = { path = "crates/sandbox" }
rustcloud-media = { path = "crates/media" }
rustcloud-ml = { path = "crates/ml" }

# HTTP
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header", "compression-gzip", "compression-br", "cors"] }
http-body-util = "0.1"
# The proxy of plugins' services: WebSocket connections taken over as they are.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
# Requests of plugins to other servers: public CAs and the system's own.
openidconnect = { version = "4.1", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }

# WebAssembly apps
wasmtime = "50"
wasmtime-wasi = "50"

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

# Database
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
    "with-uuid",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Security
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"

# Confining tools the server runs (ffmpeg)
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
# Photo and video metadata (EXIF, QuickTime), in memory-safe Rust
nom-exif = "3"
# Neural networks for plugins (use.onnx), in memory-safe Rust; prost builds test models
tract-onnx = "0.23"
prost = "0.14"

# Misc
mime_guess = "2"
rust-embed = "8"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
semver = { version = "1", features = ["serde"] }
toml_edit = "0.25"
url = "2"
ipnet = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", default-features = false }

# Tests
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Debug builds: line numbers for our code, no debug info for dependencies.
# Keeps target/ several times smaller and builds faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is very slow without optimisations; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
