id = "notes"
version = "0.1.0"
# `permissions.images` needs 0.2.18.
api = "^0.2.18"

[name]
en = "Notes"
ru = "Заметки"

[provides]
"rustcloud:notes" = "0.1.0"

# Notes are .md files in one folder the user chooses (or creates).
[permissions]
files = "folder"
files_write = true
# Pictures a note links to, shown when the user asks for them.
images = "any"

[ui]
icon = "note"
entry = "/app/notes"
