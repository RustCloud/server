# Editor: text files of any folder, opened from the files' "Open with".
# Built into the Docker image like Notes.
# Build: cargo build --release --target wasm32-wasip2
[package]
name = "editor"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the server's workspace: built for wasm32-wasip2 on its own.
[workspace]
