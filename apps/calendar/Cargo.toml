# Calendar: events in the user's AppData, CalDAV for phones and desktop apps.
# Build: cargo build --release --target wasm32-wasip2
[package]
name = "calendar"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
quick-xml = "0.38"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of the server's workspace: built for wasm32-wasip2 on its own.
[workspace]
